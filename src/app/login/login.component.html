<div class="container">
  <div class="form-box">
    <h2>Login</h2>
    <form (ngSubmit)="login()">
      <input type="text" placeholder="Username" name="username" required [(ngModel)]="username" />
      <input type="password" placeholder="Password" name="password" required [(ngModel)]="password" />
      <button class="login-btn" type="submit">Login</button>
    </form>
    <a class="link" href="/register">Create Account</a>
  </div>
</div>
